esphome:
  name: test-device
  friendly_name: Test Device

esp32:
  board: esp32dev

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      # type: git
      # url: https://github.com/antokara/esphome-fswm100
      # ref: test-1
      type: local
      path: ./esphome/components
    components: [fswm100]
    refresh: 0.5min

# demo with fsw100
fswm100:
  ads1115_id: ads1115_a
  flow:
    name: Water Flow
    unit_of_measurement: gal/min
    accuracy_decimals: 2
    # ADS1115
    multiplexer: "A1_GND"
    gain: 6.144
    sample_rate: 860
    resolution: 16_BITS
  pulse:
    name: Water Meter Pulse
    gpio_pin:
      number: GPIO04
      mode:
        input: true
        pullup: true
  pressure:
    name: Water Pressure
    accuracy_decimals: 2
    unit_of_measurement: psi
    min_voltage: 0.5
    max_voltage: 4.5
    min_pressure: 0
    max_pressure: 100
    # ADS1115
    multiplexer: "A2_GND"
    gain: 6.144
    sample_rate: 860
    resolution: 16_BITS

# required (shared) component by fsw100
i2c:
  id: i2c_a
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz

# required (shared) component by fsw100
ads1115:
  id: ads1115_a
  i2c_id: i2c_a
  address: 0x48
  continuous_mode: true

